<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon: Точилка logo -->
    <link rel="icon" href="https://raw.githubusercontent.com/onlinetochilka/theme/main/tochilka-logo.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Anti-FOUC Script for Themes -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem("tochilka_theme") || "tochilka";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>

    <meta name="description" content="Точилка — ежедневник репетитора. Расписание, ученики и финансы в одном месте." />
    <meta name="theme-color" content="#faf8f5" />
    <title>Точилка — ежедневник репетитора</title>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Yandex Tag Manager (Stub for Analytics) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Global click listener for YTM data-action tracking
      document.addEventListener('click', function(e) {
        const target = e.target.closest('[data-action]');
        if (target) {
          const action = target.getAttribute('data-action');
          dataLayer.push({
            event: 'user_action',
            action_name: action,
            element_text: target.innerText?.trim() || ''
          });
        }
      });
    </script>
    <!-- End Yandex Tag Manager -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
