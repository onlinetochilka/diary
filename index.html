<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon: Точилка logo -->
    <link rel="icon" href="https://raw.githubusercontent.com/onlinetochilka/theme/main/tochilka-logo.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Anti-FOUC Script for Themes -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem("tochilka_theme") || "tochilka";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>

    <meta name="description" content="Удобное расписание, учет учеников и контроль финансов в одном приложении." />
    <meta name="keywords" content="ежедневник репетитора, расписание для репетитора, учет учеников, контроль финансов репетитора, CRM для репетитора, приложение для преподавателей, онлайн журнал репетитора" />
    <link rel="canonical" href="https://tutor.tochilka.app/" />
    <meta name="theme-color" content="#faf8f5" />
    <title>Точилка — помощник учителя</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tutor.tochilka.app/" />
    <meta property="og:title" content="Точилка — помощник учителя" />
    <meta property="og:description" content="Расписание, домашние задания и уведомления — всё в одном месте" />
    <meta property="og:image" content="https://tutor.tochilka.app/og-guest.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tutor.tochilka.app/" />
    <meta property="twitter:title" content="Точилка — помощник учителя" />
    <meta property="twitter:description" content="Расписание, домашние задания и уведомления — всё в одном месте" />
    <meta property="twitter:image" content="https://tutor.tochilka.app/og-guest.png" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Yandex Tag Manager (Stub for Analytics) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Global click listener for YTM data-action tracking
      document.addEventListener('click', function(e) {
        const target = e.target.closest('[data-action]');
        if (target) {
          const action = target.getAttribute('data-action');
          dataLayer.push({
            event: 'user_action',
            action_name: action,
            element_text: target.innerText?.trim() || ''
          });
        }
      });
    </script>
    <!-- End Yandex Tag Manager -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
