    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Anti-FOUC Script for Themes -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem("tochilka_theme") || "tochilka";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>

    <meta name="description" content="Точилка — ежедневник репетитора. Расписание, ученики и финансы в одном месте." />
    <meta name="theme-color" content="#faf8f5" />
    <title>Точилка — ежедневник репетитора</title>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
