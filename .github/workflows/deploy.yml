name: Deploy to Beget VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 5.35.89.238
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/*"
          target: "/var/www/tutor.tochilka.app"
          strip_components: 1
          overwrite: true
          rm: true

      - name: Copy PocketBase updates to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 5.35.89.238
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "pb_hooks/*,pb_migrations/*"
          target: "/root/pb_updates"

      - name: Apply PocketBase updates and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 5.35.89.238
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Ищем, где лежит pocketbase
            PB_EXEC=$(find /root /opt /var/www -name "pocketbase" -type f -executable 2>/dev/null | head -n 1)
            if [ -n "$PB_EXEC" ]; then
              PB_DIR=$(dirname "$PB_EXEC")
              # Удаляем сломанные хуки и миграции, чтобы восстановить сервер
              rm -rf $PB_DIR/pb_hooks/yookassa.pb.js
              rm -rf $PB_DIR/pb_migrations/1710000000_add_subscription_fields.js
              
              # Пытаемся перезапустить сервис
              systemctl restart pocketbase || systemctl restart pb || echo "Не удалось перезапустить через systemctl."
            else
              echo "Файл pocketbase не найден!"
            fi
