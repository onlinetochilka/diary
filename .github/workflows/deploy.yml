name: Deploy to Beget VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 5.35.89.238
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/*"
          target: "/var/www/tutor.tochilka.app"
          strip_components: 1
          overwrite: true
          rm: true

      - name: Copy PocketBase updates to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 5.35.89.238
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "pb_hooks/*,pb_migrations/*"
          target: "/root/pb_updates"

      - name: Apply PocketBase updates and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 5.35.89.238
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            PB_DIR="/opt/pocketbase"
            echo "Используем директорию $PB_DIR"
            
            # Копируем новые хуки и миграции
            cp -r /root/pb_updates/pb_hooks $PB_DIR/
            cp -r /root/pb_updates/pb_migrations $PB_DIR/
            
            # Перезапускаем PocketBase
            systemctl restart pocketbase || systemctl restart pb || echo "Не удалось перезапустить сервис."
